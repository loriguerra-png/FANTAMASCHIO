<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regista d'Asta — Fantacalcio</title>
<style>
:root{
  --bg-deep:#0c0a1e;
  --bg-mid:#161233;
  --bg-panel:#1b1740;
  --panel-line:rgba(140,120,255,0.22);
  --panel-line-strong:rgba(160,140,255,0.42);
  --ink:#eee9ff;
  --ink-dim:#a79fd6;
  --muted:#8880b3;
  --violet:#7c5cff;
  --violet-soft:#4d3fa8;
  --gold:#f0b93d;
  --gold-dim:#c99a2e;
  --verde:#33d17a;
  --giallo:#f0b93d;
  --rosso:#f0555d;
  --radius:16px;
  --radius-sm:10px;
  --font-display: 'Baloo 2', 'Poppins', 'Segoe UI', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(124,92,255,0.35), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(240,185,61,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg-deep), #100c26 40%, var(--bg-deep));
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
}
header.top{
  padding:26px 24px 0 24px;
  position:relative;
}
.top-inner{max-width:1180px;margin:0 auto;position:relative;}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg, var(--violet), #4a2fd6);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 0 0 1px var(--panel-line-strong), 0 8px 20px rgba(124,92,255,0.35);
}
h1{
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:0.2px;
  font-size:clamp(24px,3.4vw,32px);
  margin:0;
  color:var(--ink);
}
h1 span{color:var(--gold);}
.subtitle{color:var(--ink-dim);font-size:13px;margin-top:2px;}
.io-buttons{display:flex;gap:10px;}
.io-buttons button{
  background:var(--bg-panel);
  border:1px solid var(--panel-line);
  color:var(--ink);
  padding:10px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:var(--font-body);
  transition:border-color .15s, transform .15s;
}
.io-buttons button:hover{border-color:var(--panel-line-strong);transform:translateY(-1px);}
nav.tabs{
  max-width:1180px;
  margin:22px auto 0 auto;
  display:inline-flex;
  gap:4px;
  background:rgba(0,0,0,0.25);
  padding:5px;
  border-radius:999px;
  border:1px solid var(--panel-line);
}
nav.tabs button{
  flex:0 0 auto;
  background:transparent;
  color:var(--ink-dim);
  border:none;
  padding:10px 26px;
  font-family:var(--font-display);
  font-weight:600;
  font-size:14px;
  letter-spacing:0.3px;
  cursor:pointer;
  border-radius:999px;
  transition:background .15s, color .15s;
}
nav.tabs button.active{
  background:linear-gradient(135deg, var(--violet), #5a3fe0);
  color:#fff;
  box-shadow:0 4px 14px rgba(124,92,255,0.45);
}
main{max-width:1180px;margin:0 auto;padding:26px 24px 80px 24px;}
.page{display:none;}
.page.active{display:block;}

.budget-bar{
  background:var(--bg-panel);
  border:1px solid var(--panel-line);
  border-radius:var(--radius);
  padding:18px 24px;
  display:flex;
  gap:32px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:24px;
}
.budget-bar label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.budget-bar input[type=number]{
  width:90px;font-size:20px;font-family:var(--font-display);font-weight:700;
  border:none;border-bottom:2px solid var(--violet-soft);background:transparent;padding:2px 0;color:var(--ink);
}
.budget-stat{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--gold);}
.budget-stat.warn{color:var(--rosso);}
.budget-stat small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:normal;text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}

.reparti-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-bottom:30px;}
.reparto-card{
  background:var(--bg-panel);border:1px solid var(--panel-line);border-radius:var(--radius);
  overflow:hidden;transition:border-color .15s;
}
.reparto-card:hover{border-color:var(--panel-line-strong);}
.reparto-head{
  background:linear-gradient(90deg, rgba(124,92,255,0.25), transparent);
  color:var(--ink);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--panel-line);
}
.reparto-head h3{font-family:var(--font-display);margin:0;font-size:19px;letter-spacing:0.3px;font-weight:700;}
.reparto-icon{font-size:18px;}
.reparto-body{padding:16px 18px;}
.perc-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.perc-row input[type=number]{width:64px;padding:6px 8px;border:1px solid var(--panel-line);border-radius:var(--radius-sm);background:rgba(0,0,0,0.25);color:var(--ink);}
.perc-row .crediti{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--gold);}
.reparto-note{width:100%;min-height:52px;border:1px solid var(--panel-line);border-radius:var(--radius-sm);padding:9px;font-size:13px;font-family:var(--font-body);resize:vertical;background:rgba(0,0,0,0.2);color:var(--ink);}
.reparto-note::placeholder{color:var(--muted);}

.players-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
.players-table th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;padding:5px 6px;border-bottom:1px solid var(--panel-line);}
.players-table td{padding:6px;border-bottom:1px solid rgba(140,120,255,0.10);vertical-align:middle;}
.players-table input[type=text]{width:100%;border:none;background:transparent;font-size:13px;padding:2px;color:var(--ink);}
.players-table input[type=text]:focus{background:rgba(124,92,255,0.12);outline:1px solid var(--panel-line-strong);border-radius:4px;}
.players-table input[type=number]{width:56px;border:1px solid var(--panel-line);border-radius:6px;padding:4px;font-size:12px;background:rgba(0,0,0,0.25);color:var(--ink);}
.flag-btns{display:flex;gap:4px;}
.flag-btn{
  width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;opacity:0.3;
}
.flag-btn.g{background:var(--verde);}
.flag-btn.y{background:var(--giallo);}
.flag-btn.r{background:var(--rosso);}
.flag-btn.selected{opacity:1;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.15);}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
.del-btn:hover{color:var(--rosso);}
.add-player-row{margin-top:10px;}
.add-player-row button{
  background:rgba(124,92,255,0.18);color:var(--ink);border:1px solid var(--panel-line-strong);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;
}
.add-player-row button:hover{background:rgba(124,92,255,0.3);}

.section-title{font-family:var(--font-display);font-weight:700;font-size:22px;margin:36px 0 14px 0;letter-spacing:0.3px;color:var(--ink);display:flex;align-items:center;gap:8px;}

.pitch-wrap{
  background:radial-gradient(ellipse at center, #1c1445 0%, #0c0a22 100%);
  border:1px solid var(--panel-line);
  border-radius:var(--radius);padding:22px;position:relative;
}
.modulo-select{margin-bottom:18px;display:flex;gap:10px;align-items:center;}
.modulo-select select{padding:9px 14px;border-radius:999px;border:1px solid var(--panel-line-strong);background:var(--bg-panel);color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:14px;}
.formation-grid{display:flex;flex-direction:column-reverse;gap:22px;padding:10px 0 20px 0;}
.formation-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
.slot{
  background:rgba(20,15,50,0.85);border-radius:var(--radius-sm);padding:9px 12px;min-width:150px;
  border:1px solid var(--panel-line);border-top:3px solid var(--panel-line-strong);
}
.slot.g{border-top-color:var(--verde);}
.slot.y{border-top-color:var(--giallo);}
.slot.r{border-top-color:var(--rosso);}
.slot select{width:100%;border:none;background:transparent;font-size:13px;font-family:var(--font-body);color:var(--ink);}
.slot select option{background:#1b1740;color:var(--ink);}
.slot .role-lbl{font-size:10px;color:var(--muted);letter-spacing:0.6px;text-transform:uppercase;}

.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:820px){.live-grid{grid-template-columns:1fr;}}
.live-col{background:var(--bg-panel);border:1px solid var(--panel-line);border-radius:var(--radius);padding:18px;}
.live-col h3{font-family:var(--font-display);font-weight:700;margin-top:0;font-size:17px;}
.target-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 4px;border-bottom:1px solid rgba(140,120,255,0.10);font-size:13px;
}
.target-row .name{font-weight:700;}
.target-row .meta{color:var(--muted);font-size:12px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot.g{background:var(--verde);}.dot.y{background:var(--giallo);}.dot.r{background:var(--rosso);}
.buy-controls{display:flex;gap:6px;align-items:center;}
.buy-controls input{width:56px;padding:5px;border:1px solid var(--panel-line);border-radius:6px;background:rgba(0,0,0,0.25);color:var(--ink);}
.buy-controls button{background:linear-gradient(135deg,var(--verde),#1fa85e);color:#062f18;font-weight:700;border:none;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;}
.buy-controls button.other{background:transparent;border:1px solid var(--panel-line-strong);color:var(--ink-dim);}
.acquisti-table{width:100%;border-collapse:collapse;font-size:13px;}
.acquisti-table th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--panel-line);padding:5px 4px;}
.acquisti-table td{padding:6px 4px;border-bottom:1px solid rgba(140,120,255,0.10);}
.reparto-budget-mini{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0;}
.reparto-budget-mini b{color:var(--ink);}
.empty-hint{color:var(--muted);font-size:12px;font-style:italic;padding:10px 0;}
.filter-input{width:100%;padding:9px 12px;border:1px solid var(--panel-line);border-radius:999px;margin-bottom:12px;font-size:13px;background:rgba(0,0,0,0.25);color:var(--ink);}
.filter-input::placeholder{color:var(--muted);}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <div>
        <h1>Regista <span>d'Asta</span></h1>
        <div class="subtitle">Strategia e gestione live del fantacalcio</div>
      </div>
      <div class="io-buttons">
        <button onclick="exportData()">⬇ Salva backup</button>
        <button onclick="document.getElementById('importFile').click()">⬆ Carica backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
      </div>
    </div>
    <nav class="tabs">
      <button class="active" onclick="showPage('strategia',this)">Strategia</button>
      <button onclick="showPage('asta',this)">Asta Live</button>
    </nav>
  </div>
</header>

<main>

<!-- ===================== PAGINA STRATEGIA ===================== -->
<section id="page-strategia" class="page active">

  <div class="budget-bar">
    <div>
      <label>Budget totale (crediti)</label>
      <input type="number" id="budgetTotale" value="1000" oninput="onBudgetChange()">
    </div>
    <div class="budget-stat" id="statAllocato">0<small>Allocato ai reparti</small></div>
    <div class="budget-stat" id="statPercTot">0%<small>Somma percentuali</small></div>
  </div>

  <div class="reparti-grid" id="repartiGrid"></div>

  <div class="section-title">Formazione obiettivo</div>
  <div class="pitch-wrap">
    <div class="modulo-select">
      <label style="color:var(--chalk);font-size:13px;">Modulo:</label>
      <select id="moduloSelect" onchange="renderFormazione()"></select>
    </div>
    <div class="formation-grid" id="formationGrid"></div>
  </div>

</section>

<!-- ===================== PAGINA ASTA LIVE ===================== -->
<section id="page-asta" class="page">

  <div class="budget-bar" id="liveBudgetBar"></div>

  <div class="live-grid">
    <div class="live-col">
      <h3>Obiettivi</h3>
      <input class="filter-input" placeholder="Filtra per nome o reparto…" oninput="renderObiettivi(this.value)">
      <div id="obiettiviList"></div>
    </div>
    <div class="live-col">
      <h3>Acquisti registrati</h3>
      <table class="acquisti-table">
        <thead><tr><th>Giocatore</th><th>Rep.</th><th>Prezzo</th><th>Chi</th><th></th></tr></thead>
        <tbody id="acquistiBody"></tbody>
      </table>
      <div id="acquistiEmpty" class="empty-hint">Nessun acquisto ancora registrato.</div>
    </div>
  </div>

</section>

</main>

<footer>Dati salvati solo in locale in questa sessione — usa "Salva backup" per non perderli.</footer>

<script>
/* ---------------- MODELLO DATI ---------------- */
const REPARTI = [
  {id:'por', nome:'Portieri'},
  {id:'dif', nome:'Difensori'},
  {id:'cen', nome:'Centrocampisti'},
  {id:'att', nome:'Attaccanti'}
];

const MODULI = {
  '3-4-3':{dif:3,cen:4,att:3},
  '3-4-1-2':{dif:3,cen:5,att:2},
  '3-5-2':{dif:3,cen:5,att:2},
  '4-3-3':{dif:4,cen:3,att:3},
  '4-4-2':{dif:4,cen:4,att:2},
  '4-5-1':{dif:4,cen:5,att:1},
  '5-3-2':{dif:5,cen:3,att:2},
  '5-4-1':{dif:5,cen:4,att:1}
};

let state = {
  budgetTotale: 1000,
  reparti: {
    por: {perc:10, note:'', giocatori:[]},
    dif: {perc:20, note:'', giocatori:[]},
    cen: {perc:30, note:'', giocatori:[]},
    att: {perc:40, note:'', giocatori:[]}
  },
  formazione: {modulo:'3-4-3', slots:{}},
  acquisti: []
};

function uid(){ return 'p'+Math.random().toString(36).slice(2,9); }

/* ---------------- RENDER: REPARTI ---------------- */
function renderReparti(){
  const grid = document.getElementById('repartiGrid');
  grid.innerHTML = '';
  REPARTI.forEach(r=>{
    const rep = state.reparti[r.id];
    const crediti = Math.round(state.budgetTotale * rep.perc / 100);
    const card = document.createElement('div');
    card.className='reparto-card';
    card.innerHTML = `
      <div class="reparto-head"><h3>${r.nome}</h3></div>
      <div class="reparto-body">
        <div class="perc-row">
          <input type="number" min="0" max="100" value="${rep.perc}" onchange="setPerc('${r.id}',this.value)"> %
          <span class="crediti">≈ ${crediti} crediti</span>
        </div>
        <textarea class="reparto-note" placeholder="Note (es. quanto spendere per il 1°/2° slot…)" onchange="setNote('${r.id}',this.value)">${rep.note}</textarea>
        <table class="players-table">
          <thead><tr><th>Giocatore</th><th>Sq.</th><th>Obiettivo</th><th>Prezzo medio</th><th>Punto a</th><th></th></tr></thead>
          <tbody id="players-${r.id}"></tbody>
        </table>
        <div class="add-player-row"><button onclick="addPlayer('${r.id}')">+ Aggiungi giocatore</button></div>
      </div>`;
    grid.appendChild(card);
    renderPlayers(r.id);
  });
  updateBudgetBar();
}

function renderPlayers(repId){
  const tbody = document.getElementById('players-'+repId);
  tbody.innerHTML = '';
  state.reparti[repId].giocatori.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${p.nome}" placeholder="Nome" onchange="setPlayerField('${repId}','${p.id}','nome',this.value)"></td>
      <td><input type="text" value="${p.squadra}" placeholder="Squadra" style="width:60px" onchange="setPlayerField('${repId}','${p.id}','squadra',this.value)"></td>
      <td>
        <div class="flag-btns">
          <button class="flag-btn g ${p.valutazione==='g'?'selected':''}" title="Obiettivo n°1" onclick="setPlayerField('${repId}','${p.id}','valutazione','g')"></button>
          <button class="flag-btn y ${p.valutazione==='y'?'selected':''}" title="Obiettivo n°2" onclick="setPlayerField('${repId}','${p.id}','valutazione','y')"></button>
          <button class="flag-btn r ${p.valutazione==='r'?'selected':''}" title="Obiettivo n°3" onclick="setPlayerField('${repId}','${p.id}','valutazione','r')"></button>
        </div>
      </td>
      <td><input type="number" value="${p.prezzoMedio}" onchange="setPlayerField('${repId}','${p.id}','prezzoMedio',this.value)"></td>
      <td><input type="number" value="${p.prezzoTarget}" onchange="setPlayerField('${repId}','${p.id}','prezzoTarget',this.value)"></td>
      <td><button class="del-btn" title="Rimuovi" onclick="removePlayer('${repId}','${p.id}')">✕</button></td>`;
    tbody.appendChild(tr);
  });
}

function addPlayer(repId){
  state.reparti[repId].giocatori.push({id:uid(), nome:'', squadra:'', valutazione:'', prezzoMedio:0, prezzoTarget:0});
  renderPlayers(repId);
}
function removePlayer(repId,pid){
  state.reparti[repId].giocatori = state.reparti[repId].giocatori.filter(p=>p.id!==pid);
  renderPlayers(repId);
  renderFormazione();
}
function setPlayerField(repId,pid,field,val){
  const p = state.reparti[repId].giocatori.find(p=>p.id===pid);
  if(!p) return;
  p[field] = (field==='prezzoMedio'||field==='prezzoTarget') ? Number(val)||0 : val;
  if(field==='valutazione') renderPlayers(repId);
  renderFormazione();
}
function setPerc(repId,val){
  state.reparti[repId].perc = Number(val)||0;
  renderReparti();
}
function setNote(repId,val){
  state.reparti[repId].note = val;
}
function onBudgetChange(){
  state.budgetTotale = Number(document.getElementById('budgetTotale').value)||0;
  renderReparti();
  updateLiveBudgetBar();
}
function updateBudgetBar(){
  let percTot = 0, allocato = 0;
  REPARTI.forEach(r=>{
    percTot += state.reparti[r.id].perc;
    allocato += Math.round(state.budgetTotale*state.reparti[r.id].perc/100);
  });
  document.getElementById('statAllocato').innerHTML = allocato+'<small>Allocato ai reparti</small>';
  const percEl = document.getElementById('statPercTot');
  percEl.innerHTML = percTot+'%<small>Somma percentuali</small>';
  percEl.classList.toggle('warn', percTot!==100);
}

/* ---------------- FORMAZIONE ---------------- */
function initModuloSelect(){
  const sel = document.getElementById('moduloSelect');
  sel.innerHTML = Object.keys(MODULI).map(m=>`<option value="${m}">${m}</option>`).join('');
  sel.value = state.formazione.modulo;
}
function allObiettivi(ruoloId){
  return state.reparti[ruoloId].giocatori.filter(p=>p.nome && p.valutazione);
}
function renderFormazione(){
  state.formazione.modulo = document.getElementById('moduloSelect').value;
  const conf = MODULI[state.formazione.modulo];
  const grid = document.getElementById('formationGrid');
  grid.innerHTML='';

  function buildRow(ruoloId, count, label){
    const row = document.createElement('div');
    row.className='formation-row';
    const options = allObiettivi(ruoloId);
    for(let i=0;i<count;i++){
      const key = ruoloId+'-'+i;
      const currentVal = state.formazione.slots[key] || '';
      const current = options.find(o=>o.id===currentVal);
      const cls = current ? current.valutazione : '';
      const slot = document.createElement('div');
      slot.className = 'slot '+cls;
      slot.innerHTML = `<div class="role-lbl">${label}</div>
        <select onchange="setSlot('${key}',this.value)">
          <option value="">— scegli —</option>
          ${options.map(o=>`<option value="${o.id}" ${o.id===currentVal?'selected':''}>${o.nome}</option>`).join('')}
        </select>`;
      row.appendChild(slot);
    }
    grid.appendChild(row);
  }
  buildRow('att', conf.att, 'ATT');
  buildRow('cen', conf.cen, 'CEN');
  buildRow('dif', conf.dif, 'DIF');
  buildRow('por', 1, 'POR');
}
function setSlot(key,val){
  state.formazione.slots[key] = val;
  renderFormazione();
}

/* ---------------- PAGINA ASTA LIVE ---------------- */
function updateLiveBudgetBar(){
  const bar = document.getElementById('liveBudgetBar');
  const speso = state.acquisti.filter(a=>a.chi==='io').reduce((s,a)=>s+a.prezzo,0);
  const rimanente = state.budgetTotale - speso;
  let html = `
    <div class="budget-stat">${state.budgetTotale}<small>Budget totale</small></div>
    <div class="budget-stat">${speso}<small>Speso da te</small></div>
    <div class="budget-stat ${rimanente<0?'warn':''}">${rimanente}<small>Rimanente</small></div>`;
  REPARTI.forEach(r=>{
    const speseRep = state.acquisti.filter(a=>a.chi==='io' && a.repId===r.id).reduce((s,a)=>s+a.prezzo,0);
    const budgetRep = Math.round(state.budgetTotale*state.reparti[r.id].perc/100);
    html += `<div class="reparto-budget-mini" style="min-width:120px;flex-direction:column;"><span>${r.nome}</span><span><b>${speseRep}</b> / ${budgetRep}</span></div>`;
  });
  bar.innerHTML = html;
}

function renderObiettivi(filter){
  filter = (filter||'').toLowerCase();
  const list = document.getElementById('obiettiviList');
  list.innerHTML='';
  const compratiIds = new Set(state.acquisti.map(a=>a.pid));
  let any=false;
  REPARTI.forEach(r=>{
    allObiettivi(r.id).forEach(p=>{
      if(compratiIds.has(p.id)) return;
      const text = (p.nome+' '+r.nome).toLowerCase();
      if(filter && !text.includes(filter)) return;
      any=true;
      const row = document.createElement('div');
      row.className='target-row';
      const dot = p.valutazione==='g'?'g':p.valutazione==='y'?'y':'r';
      row.innerHTML = `
        <div>
          <span class="dot ${dot}"></span><span class="name">${p.nome}</span>
          <div class="meta">${r.nome}${p.squadra?' · '+p.squadra:''} · medio ${p.prezzoMedio} · target ${p.prezzoTarget}</div>
        </div>
        <div class="buy-controls">
          <input type="number" placeholder="cr." id="price-${p.id}" value="${p.prezzoTarget||''}">
          <button onclick="registraAcquisto('${r.id}','${p.id}','io')">Preso</button>
          <button class="other" onclick="registraAcquisto('${r.id}','${p.id}','altro')">Ad altri</button>
        </div>`;
      list.appendChild(row);
    });
  });
  if(!any){
    list.innerHTML = '<div class="empty-hint">Nessun obiettivo disponibile: aggiungi giocatori e valutali nella pagina Strategia.</div>';
  }
}

function registraAcquisto(repId,pid,chi){
  const priceInput = document.getElementById('price-'+pid);
  const prezzo = Number(priceInput.value)||0;
  const p = state.reparti[repId].giocatori.find(pl=>pl.id===pid);
  state.acquisti.push({id:uid(), pid, nome:p.nome, repId, prezzo, chi});
  renderAll();
}
function rimuoviAcquisto(id){
  state.acquisti = state.acquisti.filter(a=>a.id!==id);
  renderAll();
}
function renderAcquisti(){
  const body = document.getElementById('acquistiBody');
  body.innerHTML='';
  state.acquisti.forEach(a=>{
    const repNome = REPARTI.find(r=>r.id===a.repId).nome;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${a.nome}</td><td>${repNome.slice(0,3)}</td><td>${a.prezzo}</td><td>${a.chi==='io'?'Tu':'Altri'}</td>
      <td><button class="del-btn" onclick="rimuoviAcquisto('${a.id}')">✕</button></td>`;
    body.appendChild(tr);
  });
  document.getElementById('acquistiEmpty').style.display = state.acquisti.length?'none':'block';
}

/* ---------------- TABS ---------------- */
function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='asta') renderAll();
}

/* ---------------- EXPORT / IMPORT ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fantacalcio-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      state = Object.assign(state, data);
      document.getElementById('budgetTotale').value = state.budgetTotale;
      initModuloSelect();
      renderAll();
    }catch(err){
      alert('File non valido.');
    }
  };
  reader.readAsText(file);
}

/* ---------------- INIT ---------------- */
function renderAll(){
  renderReparti();
  renderFormazione();
  updateLiveBudgetBar();
  renderObiettivi('');
  renderAcquisti();
}
initModuloSelect();
renderAll();
</script>
</body>
</html>
